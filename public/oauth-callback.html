<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth Callback</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .container {
      text-align: center;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: 24px;
    }

    p {
      margin: 0;
      opacity: 0.9;
      font-size: 14px;
    }

    .error {
      background: rgba(244, 67, 54, 0.2);
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .error h2 {
      margin: 0 0 8px 0;
      font-size: 18px;
      color: #ffcdd2;
    }

    .error p {
      color: #ffebee;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Completing Authentication</h1>
    <p>Please wait while we complete the OAuth authentication...</p>
    <div id="error-container"></div>
  </div>

  <script>
    (function() {
      try {
        // Parse URL parameters
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const error = params.get('error');
        const errorDescription = params.get('error_description');

        if (error) {
          showError('Authentication Failed', errorDescription || error);
          return;
        }

        if (!code || !state) {
          showError('Invalid Callback', 'Missing authorization code or state parameter');
          return;
        }

        // Send message to opener window
        if (window.opener) {
          window.opener.postMessage({
            type: 'oauth-callback',
            code: code,
            state: state
          }, window.location.origin);

          // Close this window after a short delay
          setTimeout(() => {
            window.close();
          }, 1000);
        } else {
          showError('Callback Error', 'Could not communicate with parent window');
        }
      } catch (err) {
        showError('Unexpected Error', err.message);
      }
    })();

    function showError(title, message) {
      const errorContainer = document.getElementById('error-container');
      errorContainer.innerHTML = `
        <div class="error">
          <h2>${title}</h2>
          <p>${message}</p>
        </div>
      `;

      // Hide spinner
      document.querySelector('.spinner').style.display = 'none';
      document.querySelector('h1').textContent = 'Authentication Error';
      document.querySelector('p').textContent = 'An error occurred during authentication.';
    }
  </script>
</body>
</html>
